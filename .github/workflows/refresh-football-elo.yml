name: Refresh Football Elo

# Hebdo : Elo interne 16 championnats (CSV football-data.co.uk, base 1500,
# K=22, HFA +55, carryover 0.7) -> public/data/elo-football.json
#
# Triggers:
#   - schedule: lundi 05:30 UTC (après le refresh FD quotidien 04:45)
#   - workflow_dispatch: manuel (+ --league pour une seule ligue)

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      league:
        description: "Slug ligue (vide = toutes)"
        type: string
        required: false
        default: ""

concurrency:
  group: refresh-football-elo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compute:
    name: Compute internal football Elo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-rankings.txt

      - name: Compute Elo
        run: |
          ARGS="--output-dir public/data"
          if [ -n "${{ inputs.league }}" ]; then
            ARGS="$ARGS --league ${{ inputs.league }}"
          else
            ARGS="$ARGS --all"
          fi
          python scripts/compute_football_elo.py $ARGS

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/elo-football.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/elo-football.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/elo-football.json
          git commit -m "chore(data): refresh football elo [skip ci]"
          git push
