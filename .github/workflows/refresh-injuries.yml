name: Refresh Injuries

# Hebdo : infirmerie RotoWire (5 grands championnats) -> public/data/injuries/*.json
# Source JSON brute sans anti-bot (module requests suffit).
# Limite : date de retour paywall — seuls statut/blessure/poste sont stockés.
#
# Triggers:
#   - schedule: lundi 05:00 UTC (hebdo, les infirmeries bougent peu en 24h)
#   - workflow_dispatch: manuel (+ --league pour une seule ligue)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      league:
        description: "Slug ligue (vide = toutes)"
        type: string
        required: false
        default: ""

concurrency:
  group: refresh-injuries
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape RotoWire injury report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements-rankings.txt

      - name: Scrape injuries
        run: |
          mkdir -p public/data/injuries
          ARGS="--output-dir public/data/injuries"
          if [ -n "${{ inputs.league }}" ]; then
            ARGS="$ARGS --league ${{ inputs.league }}"
          else
            ARGS="$ARGS --all"
          fi
          python scripts/scrape_rotowire_injuries.py $ARGS

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data/injuries/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data/injuries/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/injuries/
          git commit -m "chore(data): refresh injuries [skip ci]"
          git push
